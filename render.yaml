# Render blueprint: one web service serves the API and the built React app (single origin).
services:
  - type: web
    name: mistridge-estate
    runtime: node
    buildCommand: npm --prefix backend install --omit=optional && npm --prefix frontend install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: INGEST_KEY
        generateValue: true
